[project]
name = "windtunnel"
version = "0.1.0"
description = "Research framework for systematic trading strategies, built for honest out-of-sample evaluation."
requires-python = ">=3.11,<3.13"
dependencies = [
    "ccxt==4.5.84",
    "matplotlib==3.11.2",
    "numpy==2.4.6",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "scipy==1.17.1",
    "yfinance==1.7.0",
]

[project.scripts]
windtunnel = "windtunnel.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pandas-stubs==3.0.5.260914",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PD", "NPY"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["ccxt.*", "yfinance.*", "scipy.*", "matplotlib.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["network: needs internet access (skipped by default; run with -m network)"]
